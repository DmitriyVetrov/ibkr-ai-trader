# Long Call — directional bullish.
#
# The allow-list is authoritative: a StrategyType with no file here is not
# tradeable, regardless of what an agent proposes.
name: long_call
strategy_type: LONG_CALL
spec_version: "1.0.0"
enabled: true
description: >-
  Single long call. Used when research concludes a predominantly bullish move
  within the campaign horizon.

# Hypotheses this strategy is permitted to answer. The strategy agent must
# justify the match; this list makes the mapping reviewable rather than
# implicit in a prompt.
applicable_hypotheses:
  - B

# Instrument classes this strategy may be written on. ETFs are reported as
# STOCK by IBKR, so SPY and AAPL are the same security type here.
allowed_underlying_types:
  - STOCK

dte_min: 14
dte_max: 30
target_delta: 0.60

# The legs, as templates. No strike and no expiry appear here: those are what
# the deterministic contract selector resolves against a real chain. The
# structure (one long call) is also asserted in code, so a configuration cannot
# quietly turn this into a spread.
legs:
  - action: BUY
    right: CALL
    ratio: 1
    # Inherits target_delta above. The selector needs a real delta on the
    # candidate; without one the selection is unavailable, never approximated.
    strike_policy: TARGET_DELTA

expiration_policy:
  rule: TARGET_DTE
  target_dte: 21

# Fields a candidate must actually carry. A missing one is a named rejection.
required_option_fields:
  - CONTRACT_ID
  - BID
  - ASK
  - DELTA

# Option-level liquidity must be established. Underlying share volume is not
# evidence that this contract has a market.
require_option_liquidity: true

min_option_price: "0.50"
max_option_price: "25.00"
min_implied_volatility: 0.15
max_implied_volatility: 1.20

liquidity:
  min_open_interest: 500
  min_daily_volume: 100
  max_bid_ask_spread_pct: 8.0

exit_policy:
  trailing_stop_pct: 30.0
  take_profit_pct: 100.0
  max_loss_pct: 50.0
  close_at_dte: 7
  allow_independent_leg_exit: false
