# Application-level configuration.
#
# config_version is stamped into every trade record so a past decision can be
# replayed against the policy that was actually in force at the time. Bump it
# whenever any file in config/ changes in a way that affects decisions.
name: trading-system
config_version: "2026.08.14-1"

# Display/scheduling timezone only. All internal timestamps are UTC.
display_timezone: Europe/Madrid

data_dir: data
trades_dir: trades
reports_dir: reports
