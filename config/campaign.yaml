# Campaign capital and the deterministic allocation policy (Milestone 7).
#
# This budget is INDEPENDENT of IBKR account buying power. The paper account
# holds a large simulated balance; that balance is not permission to spend.
# When the two disagree, the more restrictive one wins — a campaign cannot
# exceed its own envelope, and it cannot spend money the account does not have.
#
# This file is the CHILD of risk.yaml in the limit hierarchy:
#
#     config/risk.yaml   ->   config/campaign.yaml   ->   config/strategies/*.yaml
#          global                  campaign                     strategy
#
# A child may NARROW a parent limit and may never widen one. Loading refuses to
# start if one tries; nothing is silently clamped, because a clamped limit is a
# limit nobody can see.
#
# Monetary values are quoted strings or integers so they parse as exact
# decimals. An unquoted 0.50 would be a binary float and is rejected.
campaign_id: campaign-002

# --- the money the operator actually has -----------------------------------
#
# Declared in the currency it is actually held in. This is NOT the currency
# this campaign trades in; see currency_policy.target_currency below. The
# figure is never converted in place and never loses its currency: a converted
# equivalent is derived beside it, per run, at a rate captured from the broker.
budget_currency: EUR
budget: "7500"

# Fraction of the budget held back and never allocated. The allocator must not
# spend the whole budget merely because candidates exist. Maximum campaign
# utilisation is the complement of this and is deliberately not stated twice.
reserve_fraction: 0.20

min_allocation: "375"
max_allocation_per_trade: "2250"
max_open_positions: 5

# Opportunities scoring below this never reach allocation.
min_opportunity_score: 70.0

# --- how much may be lost, as opposed to how much may be committed ---------
#
# Allocation answers "how much capital can we commit"; risk answers "how much
# can we afford to lose". For a long-debit structure the two coincide, but the
# engine keeps them separate so the first strategy where they diverge does not
# quietly inherit the wrong limit.
max_risk_per_trade: "2250"

# --- position and concentration limits -------------------------------------
limits:
  # One structure per underlying. Raise it deliberately: two structures on one
  # name are one bet held twice, and correlation is not modelled here.
  max_positions_per_underlying: 1
  # Ceiling on contract count regardless of price. A very cheap option would
  # otherwise buy a position of a size nobody intended.
  max_contracts_per_trade: 30
  # New authorisations per run, so one run cannot commit the whole campaign
  # before an operator has seen any of it.
  max_new_positions_per_run: 3

# --- account snapshot policy ------------------------------------------------
account:
  # An allocation without a view of the account is an allocation against an
  # unknown balance. Fail closed rather than assume the money is there.
  require_account_snapshot: true
  # An account snapshot older than this cannot support an authorisation.
  max_snapshot_age_seconds: 86400
  # Whether the daily-loss limit must be evaluable before capital is
  # authorised. Realised profit and loss is not tracked until Milestone 9, so
  # this is false today and the check is recorded as NOT_EVALUATED rather than
  # silently passed. Milestone 9 sets it true.
  require_daily_loss_tracking: false

# --- currency policy --------------------------------------------------------
#
#     budget_currency   EUR      what the operator holds        (above)
#           |
#           |  x EUR/USD, captured from the broker with the balance it converts
#           v
#     target_currency   USD      what this campaign trades      (here)
#           ==
#     instrument        USD      what the option is quoted in
#
# The conversion happens once, before any comparison between account capital
# and an instrument price. Risk, allocation and position sizing then work
# entirely in the target currency, so no comparison anywhere crosses a currency
# without a rate behind it.
#
# There is deliberately NO setting here that makes two currencies equal. The
# one that used to - treat_as_campaign_currency - asserted "1 USD is accounted
# as 1 EUR" and has been removed; a configuration still carrying it fails to
# load with a message saying so. If no valid rate is available the answer is
# FX_RATE_UNAVAILABLE and nothing is authorised, sized or sent.
#
# The rate source is the broker itself: IBKR reports a per-currency
# ExchangeRate with the account summary this system already reads, so the rate
# costs no extra round trip and cannot come from a different instant than the
# balance it converts. No rate is configured here, because a rate in a file is
# a rate nobody refreshed.
currency_policy:
  # Determined by the instruments this campaign targets, not by the account's
  # base currency. Changing the IBKR account's base currency is not required
  # and would not affect this line.
  target_currency: USD
  # How old the rate may be at the decision instant. A day: a campaign envelope
  # is not a limit price. The quote freshness that actually gates a trade is
  # risk.yaml's max_market_data_age_seconds, which is far stricter.
  max_rate_age_seconds: 86400

# --- allocation policy ------------------------------------------------------
allocation:
  # Order candidates by deterministic priority, then fund each in turn with
  # whatever the limits still permit. Transparent, reproducible, explainable —
  # and replaceable, which is why the policy is named rather than implied.
  policy: PRIORITY_FIRST_FIT
  # Stamped onto every stored allocation, so a past authorisation traces to the
  # exact policy that produced it. Bumped to 1.1.0 when the envelope stopped
  # being spent in the currency it is declared in: the allocator's rule is
  # unchanged, but the money it applies the rule to is now converted, so an
  # authorisation made before and after this line are not the same decision.
  policy_version: "1.1.0"
  # Unit cost is taken from the ask by default: what it would actually cost to
  # buy. MID_DEBIT is available but assumes a fill nobody has been offered.
  price_source: ASK_DEBIT
  # Rejected and unfunded candidates kept on the stored run record.
  max_candidates_recorded: 50

# --- deterministic opportunity ranking -------------------------------------
#
# Weights, not a model. Every component below is read from a structured
# upstream fact — never from prose, never from a model's own opinion of its
# work — and every component's value is recorded on the stored decision, so a
# score can be recomputed by hand from the record. Weights must sum to 1.
ranking:
  research_confidence_weight: 0.30
  strategy_confidence_weight: 0.20
  expected_magnitude_weight: 0.15
  spread_quality_weight: 0.20
  data_quality_weight: 0.15
