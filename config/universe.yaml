# Universe selection policy (Milestone 4).
#
# Which underlyings are even considered for research, and what a candidate must
# prove before an AI agent is allowed to rank it. Nothing here is a trading
# rule: the universe selector picks what is worth *researching*, never what to
# buy, which strategy to use, or how much to spend.
#
# Every threshold lives here rather than in code, so a change to what the
# system considers research-ready shows up in a diff. Money values are quoted
# strings or integers so they parse as exact decimals; an unquoted 5.00 is a
# binary float and is rejected.
config_version: "2026.08.22-2"

# ---------------------------------------------------------------------------
# Where the candidate pool comes from.
#
# The source is explicit and versioned because "which assets were considered on
# date T" is part of reconstructing a decision. Bump `version` whenever the
# symbol list changes; a stored run records the version it ran against.
#
# kind:
#   STATIC   symbols listed below                      (implemented)
#   FILE     newline-delimited file at `location`       (implemented)
#   CUSTOM   a curated list; same mechanics as STATIC   (implemented)
#   SP500 / NASDAQ100 / ETF_UNIVERSE / IBKR_DISCOVERED  (not implemented)
#
# The index kinds are deliberately unimplemented rather than approximated. A
# constituent list written from memory would be invented data, and an S&P 500
# universe that is quietly wrong produces research nobody can trust. They fail
# with CONFIGURATION_ERROR naming what they would need.
# ---------------------------------------------------------------------------
source:
  kind: CUSTOM
  name: liquid-us-option-underlyings-50
  version: "2026.08.22-2"
  # A HAND-CURATED pool of underlyings whose LISTED OPTION markets are deep and
  # continuously traded — weekly expirations, dense strikes, quoted two-sided
  # through the session. The system speculates in options, so the selection
  # criterion is the option market, not the share's fame or its share volume.
  #
  # `CUSTOM` rather than `STATIC` is the honest label: the two behave
  # identically and differ only in intent. This is a judgement about what is
  # worth *considering*, deliberately NOT presented as a measured ranking of
  # option volume or open interest — no such measurement was taken, and
  # inventing one is what the unimplemented SP500 / NASDAQ100 kinds refuse to
  # do. What IS measured happens later and with real data: `min_open_interest`
  # and `max_bid_ask_spread_pct` in risk.yaml, applied per contract at M6,
  # where `unknown_liquidity_policy: REJECT` refuses a chain nobody quoted.
  #
  # Two structural constraints shaped this list, and both are checkable:
  #
  #   1. Underlying liquidity is NOT option liquidity, and this stage cannot
  #      judge the latter at all — it has no option-level data. Membership here
  #      is a hypothesis that M6 tests against real quotes.
  #   2. campaign.yaml's max_allocation_per_trade (EUR 1500, about USD 1650)
  #      caps ONE unit of a structure at roughly $16.50 of quote, and
  #      risk.yaml's max_option_price caps it at $25.00 outright. An ATM 21-DTE
  #      premium runs near 0.096 x price x IV, so an underlying is only usable
  #      when price x IV stays under about 172 — and under about 86 for a
  #      straddle or strangle, which pays for two legs. Measured against the
  #      stored 2026-08-21 quotes that already rules a SPY straddle out at
  #      roughly $2,200 a unit. Very high priced or very high IV names are
  #      therefore absent: they would pass every filter here and then be
  #      rejected MAX_ALLOCATION_PER_TRADE_EXCEEDED with a contract in hand.
  #
  # Index products (SPX, NDX, RUT, VIX) are absent for a third reason: IBKR
  # reports them as INDEX and `allowed_security_types` admits STOCK only, so
  # each would be a guaranteed SECURITY_TYPE_NOT_ALLOWED. Leveraged and inverse
  # ETFs (TQQQ, SQQQ, UVXY) are absent for a fourth: their path dependence
  # makes a 2-4 week long-premium thesis a different instrument from the one
  # the shipped strategies describe.
  #
  # Being listed here buys nothing. Every symbol still has to pass every filter
  # below against real stored data.
  symbols:
    # ETFs. Not "ETF speculation" — these are the deepest listed option books
    # that exist, and the system buys the option, never the fund.
    - SPY
    - QQQ
    - IWM
    - TLT
    - SMH
    - XLF
    - XLE
    - GLD
    # Mega-caps, where single-name option flow concentrates.
    - NVDA
    - TSLA
    - AAPL
    - AMZN
    - META
    - MSFT
    - GOOGL
    - PLTR
    # Semiconductors.
    - AMD
    - INTC
    - MU
    - AVGO
    - QCOM
    - TSM
    # Software, internet and platforms, kept to the mid-priced end.
    - ORCL
    - CRM
    - UBER
    - PYPL
    - SNAP
    - SHOP
    # Crypto-linked. High IV is wanted here; high IV on a high price is not,
    # which is why MSTR is absent and the miners are present.
    - COIN
    - MARA
    - RIOT
    - HOOD
    - SOFI
    # Electric vehicles and the retail speculation names, cheap premium.
    - RIVN
    - LCID
    - NIO
    - GME
    # Financials, at the liquid and inexpensive end of the sector.
    - JPM
    - BAC
    - C
    - WFC
    # Consumer, telecom and other high option turnover at a low share price.
    - F
    - T
    - WMT
    - DIS
    - BABA
    # Healthcare.
    - PFE
    - UNH
    # Energy and industrials.
    - XOM
    - BA

# ---------------------------------------------------------------------------
# Deterministic filters.
#
# These decide eligibility. The AI agent runs *after* them and cannot restore
# anything they excluded — that hierarchy is the point of the milestone.
# ---------------------------------------------------------------------------
filters:
  # SecurityType values. ETFs are reported as STOCK by IBKR, so SPY and AAPL
  # are the same security type here.
  allowed_security_types:
    - STOCK
  allowed_currencies:
    - USD
  # Empty means any exchange. Populate to restrict.
  allowed_exchanges: []

  # A price floor, not a valuation opinion: sub-dollar underlyings have option
  # chains too thin and too wide to be worth researching.
  min_price: "5.00"

  # UNDERLYING share volume, never option volume. Stock liquidity is a
  # pre-filter for option liquidity, not a substitute for it — establishing
  # that an option is liquid needs option-level data this milestone does not
  # collect.
  min_average_daily_volume: 1000000

  # How old the market data may be and still support a research decision.
  # 24h: universe selection runs daily and a previous close is a legitimate
  # basis for "is this worth researching", unlike an execution decision.
  max_data_age_seconds: 86400

  # The data layer's eight-dimension verdict. A record that is well-formed but
  # economically impossible is not a basis for research.
  require_research_usable: true

  # REQUIRED         optionable underlyings only; UNKNOWN is rejected
  # UNKNOWN_ALLOWED  UNKNOWN passes and is flagged to the agent
  # IGNORED          optionability is not considered
  #
  # REQUIRED is the honest default for an options system: an underlying we have
  # not established to be optionable cannot become an option trade. UNKNOWN is
  # never silently read as TRUE or as FALSE either way.
  optionability_policy: REQUIRED

  # Never considered, whatever the data says. Takes precedence over everything.
  exclusions: []

  # Most candidates that may reach the agent. Excess candidates are dropped in
  # a deterministic order and recorded as CANDIDATE_LIMIT_EXCEEDED, never
  # silently.
  max_candidates: 50

  # Hard ceiling on the research-ready universe. An agent returning more than
  # this fails validation; it is not truncated back into range, because
  # truncating would silently change what the model actually said.
  max_selected_assets: 10

# ---------------------------------------------------------------------------
# AI ranking policy.
#
# The agent ranks already-validated candidates. It cannot admit an excluded
# asset, predict direction, pick a strategy, choose a contract or size a
# position — and the deterministic post-validation enforces that rather than
# trusting the prompt.
#
# No secret belongs here. ANTHROPIC_API_KEY comes from the environment.
# ---------------------------------------------------------------------------
ai_ranking:
  enabled: true
  provider: ANTHROPIC
  model: claude-opus-5
  # Bumped whenever the prompt changes in a way that could alter a ranking. It
  # is stamped into every stored run, so a past universe can be traced to the
  # exact instructions that produced it.
  prompt_version: "1.0.0"
  timeout_seconds: 120.0
  max_output_tokens: 8000
  # low | medium | high | xhigh | max. Ranking a few dozen pre-validated
  # candidates on supplied evidence is not a deep-reasoning task.
  effort: medium

  # Fail closed. With AI ranking enabled, an unavailable or invalid model
  # response ends the run as AI_UNAVAILABLE / AI_INVALID_OUTPUT — it does not
  # quietly fall back to a deterministic ordering that would then be indistinguishable
  # from a model's judgement in the stored record. Setting this true is an
  # explicit, recorded choice: such runs are stamped DETERMINISTIC_ONLY.
  allow_deterministic_fallback: false
