# Local infrastructure (specification section 43).
#
#   ib-gateway  --(broker API)-->  trading-runtime
#
# Ports and credentials come from the environment. Copy .env.example to .env
# first. No credential belongs in this file.
#
# Port reference — these differ and are easy to confuse:
#   IB Gateway paper 4002   IB Gateway live 4001
#   TWS paper        7497   TWS live        7496
# The gateway container always listens on 4002 internally in paper mode; the
# host port is IBKR_PORT.

services:
  ib-gateway:
    # IB Gateway + IBC. Pin to a digest before any live use.
    image: ${IB_GATEWAY_IMAGE:-ghcr.io/gnzsnz/ib-gateway:stable}
    restart: unless-stopped
    environment:
      # "paper" or "live". Mirrors TRADING_MODE but is a separate switch:
      # the gateway must not silently follow the application into live mode.
      TRADING_MODE: ${IB_GATEWAY_MODE:-paper}
      TWS_USERID: ${IBKR_USERNAME}
      TWS_PASSWORD: ${IBKR_PASSWORD}
      # Second line of defence: the gateway rejects order placement on the API
      # even if the application asks. Milestone 2 is read-only, so leave "yes".
      READ_ONLY_API: ${IB_GATEWAY_READ_ONLY:-yes}
      TZ: ${TZ:-Etc/UTC}
    ports:
      # Host port is configurable; nothing is hard-coded.
      - "${IBKR_PORT:-4002}:4002"
    healthcheck:
      # bash's /dev/tcp needs no extra package in the image, unlike nc.
      test:
        ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/4002' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # IB Gateway logs in and initialises slowly; a short window causes
      # spurious restarts before it is genuinely ready.
      start_period: 120s

  trading-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      ib-gateway:
        condition: service_healthy
    # Shares ib-gateway's network namespace rather than reaching it over the
    # bridge network. The gateway image trusts only 127.0.0.1 for API access
    # (jts.ini's TrustedIPs, not configurable via env in this image) — a
    # container-to-container connection arrives from a different IP, gets
    # accepted at the TCP level and then never answered, which looks exactly
    # like a hang rather than a refusal. Sharing the namespace makes the
    # runtime appear as 127.0.0.1 to the gateway, satisfying the trust rule
    # structurally instead of fighting it.
    network_mode: "service:ib-gateway"
    environment:
      TRADING_MODE: ${TRADING_MODE:-PAPER}
      # Loopback: see network_mode above. Not the service name/host port.
      IBKR_HOST: 127.0.0.1
      IBKR_PORT: 4002
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-1}
      IBKR_ACCOUNT: ${IBKR_ACCOUNT}
      IBKR_READ_ONLY: ${IBKR_READ_ONLY:-true}
      IBKR_MARKET_DATA_TYPE: ${IBKR_MARKET_DATA_TYPE:-3}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      LOG_FORMAT: json
      # Telemetry (Milestone 11). Ships OFF. The collector lives behind the
      # `observability` profile, so with the profile down these are simply
      # unread — the runtime does not try to reach a collector that is not
      # there, and would run identically if it did and failed.
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
    volumes:
      # Research artifacts and trade records outlive the container.
      - ./data:/app/data
      - ./trades:/app/trades
      - ./reports:/app/reports
    healthcheck:
      # Offline check: validates configuration and schemas without connecting.
      test: ["CMD", "python", "-m", "trading_system.cli", "health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s
    # Milestone 2 is read-only: the runtime reports connectivity and exits.
    # An autonomous trading loop is not started, and none exists yet.
    command: ["test", "ibkr-connection"]

  # -------------------------------------------------------------------------
  # Observability stack (Milestone 11). OPTIONAL, and behind a profile:
  #
  #   docker compose --profile observability up
  #
  # The trading system starts and runs without any of this. That is the
  # milestone's central claim, not a convenience — telemetry is a side channel,
  # and a system whose trading behaviour depended on a Grafana container would
  # have the dependency exactly backwards.
  #
  # Data flows one way only:
  #
  #   trading-runtime --OTLP--> otel-collector --> tempo / prometheus / loki
  #                                                        |
  #                                                     grafana
  #
  # No secret belongs in any of these services. The Grafana password is an
  # environment variable with a local-development default, and the alert
  # webhook URL is passed to the application rather than to this stack.
  # -------------------------------------------------------------------------
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.115.1}
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    ports:
      # OTLP in. The application talks to this and to nothing else.
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      # The collector's OWN telemetry, and the application metrics it exports
      # for Prometheus to scrape. Published to the host for the Milestone 12
      # acceptance gate, which asks the collector how many spans it actually
      # ACCEPTED — the one question that distinguishes "the collector is up"
      # from "the collector is receiving telemetry from this application", and
      # the distinction M11's NOT_TESTED status turned on.
      - "${OTEL_COLLECTOR_TELEMETRY_PORT:-8888}:8888"
      - "${OTEL_COLLECTOR_EXPORTER_PORT:-8889}:8889"
    depends_on:
      - tempo
      - loki

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.6.1}
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.0.1}
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      # Local development retention. Metrics are operational; the audit record
      # is the immutable domain artifact and is not stored here.
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./deploy/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.3.2}
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      # Local development only. Change it, or put Grafana behind something
      # that authenticates, before this is reachable from anywhere.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Trace-to-log and log-to-trace navigation.
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
