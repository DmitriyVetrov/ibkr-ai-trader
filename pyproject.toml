[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-system"
version = "0.1.0"
description = "Autonomous IBKR options trading system (paper-trading research platform)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
    "typer>=0.12",
    "rich>=13.8",
    "structlog>=24.4",
]

[project.optional-dependencies]
# IBKR connectivity. Optional so the domain layer, the simulator and the whole
# unit test suite stay runnable without the broker library installed.
ibkr = [
    "ib_async>=2.0",
]
# AI ranking. Optional for the same reason as ibkr: the domain layer, the
# deterministic pre-filter and the whole unit test suite run without it, and no
# test needs an API key. Absent the package, a universe run ends as
# AI_UNAVAILABLE rather than silently substituting an ordering of its own.
llm = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "ib_async>=2.0",
]

[project.scripts]
trading-system = "trading_system.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_system"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: deterministic tests with no network, broker or LLM access",
    "contract: workflow-boundary schema compatibility tests",
    "integration: multi-component tests, simulated broker only",
    "ibkr: requires a reachable IB Gateway; never run by default",
    "paper: runs against the IBKR paper account; requires ALLOW_LIVE_TESTS=true",
    "live: capable of touching a real broker account; requires ALLOW_LIVE_TESTS=true",
    "llm: requires a real Anthropic API call; never run by default",
    # The only marker in the suite that can place a real order. It needs
    # ALLOW_LIVE_TESTS=true *and* RUN_PAPER_EXECUTION_TESTS=true, and refuses
    # to run in any mode but PAPER. Two variables rather than one because a
    # developer who unlocked the gateway for a read-only diagnostic must not
    # thereby have authorised an order (brief section 45).
    "paper_execution: SUBMITS A REAL PAPER ORDER; needs ALLOW_LIVE_TESTS=true and RUN_PAPER_EXECUTION_TESTS=true",
]
filterwarnings = [
    "error",
    # ib_async calls asyncio.get_event_loop() when no loop is running, which
    # Python deprecates. Without this the warning becomes an exception under
    # `filterwarnings = error` and every gateway-backed test fails with a
    # misleading "There is no current event loop" instead of connecting.
    "ignore:There is no current event loop:DeprecationWarning",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The Anthropic SDK is an optional extra, imported lazily inside the one client
# that uses it. Type-checking must pass without it installed, exactly as it does
# for a checkout with no ib_async — neither is a prerequisite for the domain.
module = "anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
# The source tree stays strict. Tests are verified by running them, and fully
# annotating every fixture parameter and fake would add annotation noise
# without adding safety — `disallow_untyped_defs` was already relaxed here for
# the same reason; the two flags below are the rest of that same intent.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.coverage.run]
source = ["src/trading_system"]
branch = true
