# Loki — log storage for local development (Milestone 11).
#
# Receives OTLP logs from the collector. The trading application emits
# structured logs carrying trace_id and span_id; correlating those with traces
# is Grafana's job, and the domain knows nothing about either.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Local development retention. Logs are an operational record; the AUDIT
  # record is the immutable domain artifact and is not stored here.
  retention_period: 168h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
